name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build and test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Unit tests, pool test and conformance
        run: make CC=${{ matrix.cc }} check

  n32:
    name: 32-bit build (ILP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 32-bit libc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-multilib
      - name: Build and test on a 32-bit target
        run: make CC=gcc EXTRA="-m32"
      - name: Unit tests, pool test and conformance on 32 bits
        run: |
          make CC=gcc EXTRA="-m32" check

  sanitizers:
    name: address and undefined behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with sanitizers
        run: make CC=clang EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer" EXTRA_LDFLAGS="-fsanitize=address,undefined"
      - name: Run
        run: |
          python3 tests/test_pool.py ./dcm
          python3 tests/conformance.py --binary ./dcm

  compare:
    name: compare with the original
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ripgrep for the original
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Build this server
        run: make
      - name: Build the original
        run: |
          git clone --depth 1 https://github.com/wonderwhy-er/DesktopCommanderMCP.git /tmp/orig
          cd /tmp/orig
          npm ci --ignore-scripts
          npm run build
      - name: Run both and compare
        run: |
          python3 tests/conformance.py --binary ./dcm \
            --original /tmp/orig/dist/index.js
